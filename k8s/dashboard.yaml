# Grafana's sidecar (kube-prometheus-stack) loads every ConfigMap labelled grafana_dashboard: "1", in any namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agecalculator-dashboard
  namespace: agecalculator
  labels:
    grafana_dashboard: "1"
data:
  agecalculator.json: |
    {
      "title": "Age Calculator",
      "uid": "agecalculator",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Pods running",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(kube_pod_status_phase{namespace=\"agecalculator\", phase=\"Running\"})" }]
        },
        {
          "id": 2, "type": "stat", "title": "Container restarts",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"agecalculator\"})" }]
        },
        {
          "id": 3, "type": "table", "title": "Images running now (tag = git commit)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "count by (container, image) (kube_pod_container_info{namespace=\"agecalculator\"})", "instant": true, "format": "table" }],
          "transformations": [{ "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "Value": "pods" } } }]
        },
        {
          "id": 4, "type": "timeseries", "title": "CPU by pod (cores)",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"agecalculator\", container!=\"\"}[$__rate_interval]))", "legendFormat": "{{pod}}" }]
        },
        {
          "id": 5, "type": "timeseries", "title": "Memory by pod",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [{ "refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"agecalculator\", container!=\"\"})", "legendFormat": "{{pod}}" }]
        },
        {
          "id": 6, "type": "timeseries", "title": "Network received by pod (app traffic)",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [{ "refId": "A", "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"agecalculator\"}[$__rate_interval]))", "legendFormat": "{{pod}}" }]
        }
      ]
    }
