apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agecalculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # The tag is rewritten by CI in mrajinfo/ageCalculator on every push to main.
          image: docker.io/mrajinfo/agecalculator-frontend:033b6a9
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: agecalculator
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
