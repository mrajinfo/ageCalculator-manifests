apiVersion: apps/v1
kind: Deployment

metadata:
  name: agecalculator
  namespace: agecalculator

spec:
  replicas: 2

  selector:
    matchLabels:
      app: agecalculator

  template:
    metadata:
      labels:
        app: agecalculator

    spec:
      containers:
        - name: agecalculator

          image: docker.io/mrajshrestha/agecalculator:bootstrap

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"

            limits:
              memory: "128Mi"
              cpu: "250m"
