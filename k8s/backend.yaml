apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: agecalculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # The tag is rewritten by CI in mrajinfo/ageCalculator on every push to main.
          image: docker.io/mrajinfo/agecalculator-backend:6a91d34
          env:
            - name: MONGODB_URI
              value: mongodb://mongo:27017/nepali_age_calculator
          ports:
            - containerPort: 5050
          # TCP rather than /api/health: the API is built to stay up and answer 503 while MongoDB is down.
          readinessProbe:
            tcpSocket:
              port: 5050
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
---
# Must be called "backend": client/nginx.conf proxies /api/ to http://backend:5050.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: agecalculator
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5050
      targetPort: 5050
